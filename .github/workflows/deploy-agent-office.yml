          || (github.event_name == 'repository_dispatch' && github.event.action == 'ts-deploy-production')
          || github.event_name == 'workflow_run'
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'refresh'))
    environment: production
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
    concurrency:
      group: agent-office-refresh-production
      cancel-in-progress: false
    steps:

    timeout-minutes: 34
    if: >-
      github.ref == 'refs/heads/main'
      && ((github.event_name == 'repository_dispatch' && github.event.action == 'ts-issues'
           && (github.event.client_payload.action == 'opened' || github.event.client_payload.action == 'closed' || github.event.client_payload.action == 'reopened'

      # to be on main, as the verify job checks a typed sha, before that commit's code is checked out
      # and run beside the Cloudflare token. This step holds only the job's read-only token.
      - name: The served sha is on main
        if: steps.serving.outputs.sha != ''
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.serving.outputs.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'$SHA' is not a full 40 character lowercase commit sha. Nothing is published."
            exit 1
          fi
          status=$(gh api "repos/$REPO/compare/$SHA...main" --jq .status) \
            || { echo "::error::$SHA is not a commit in this repository. Nothing is published."; exit 1; }

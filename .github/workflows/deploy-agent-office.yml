          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: Thitic9203
          repositories: pluton-timesheet
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read
      - name: Build the board snapshot from GitHub
        if: steps.serving.outputs.sha != ''
        timeout-minutes: 3
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ steps.snapshot-token.outputs.token }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
          AGENT_APP_LOGIN: ${{ vars.AGENT_APP_SLUG }}[bot]
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_OFFICE_PROJECT: agent-office-staging
          # ols-real R13: the OLS cards the Mac sets; data only, validated by the snapshot (E4)
          OLS_BOARD: ${{ vars.OLS_BOARD }}
        run: node scripts/agent-office-snapshot.mjs

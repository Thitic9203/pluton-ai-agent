        id: fresh
        if: steps.serving.outputs.sha != ''
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVED: ${{ steps.serving.outputs.sha }}

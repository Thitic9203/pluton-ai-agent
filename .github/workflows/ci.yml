name: CI

# pluton-ai-agent's own CI (docs/sdd/repo-split/spec.md R9, R20; global rule 18): every update and every
# pull request runs the moved tests, node --test only, on a GitHub-hosted runner. No secret, no write.
# The action pins are the ones the moved workflows use, asserted by scripts/lib/repo-split-workflows.test.mjs.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22.23.2 }
      - name: npm test
        run: npm test
